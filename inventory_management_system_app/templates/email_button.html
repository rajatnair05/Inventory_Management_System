<style>
.e_Btn {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition-duration: 0.3s;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
  background-color: #EA4335;
}

.emailSvg{
margin-left: 0.9px;
}


.e_sign {
  width: 100%;
  transition-duration: 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.e_sign svg {
  width: 25px;
}

.e_sign svg path {
  fill: white;
}
.text {
  position: absolute;
  right: 0%;
  width: 0%;
  opacity: 0;
  color: white;
  font-size: 0.9em;
  font-weight: 600;
  transition-duration: 0.3s;
  
}

.e_Btn:hover {
  width: 120px;
  border-radius: 40px;
  transition-duration: 0.3s;
}

.e_Btn:hover .e_sign {
  width: 30%;
  transition-duration: 0.3s;
  padding-left: 2px;
}

.e_Btn:hover .text {
  opacity: 1;
  width: 70%;
  transition-duration: 0.3s;
  padding-right: 7px;
}
.e_Btn:active {
  transform: translate(2px, 2px);
}

</style>
