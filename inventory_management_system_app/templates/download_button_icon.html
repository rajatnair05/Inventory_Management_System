<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* From Uiverse.io by Gaurang7717 */ 
.Btn {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition-duration: 0.3s;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
  background-color: #0077db;
}

.download-icon{
margin-bottom: 3px;
margin-left: 1px;
}


.sign {
  width: 100%;
  transition-duration: 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sign svg {
  width: 25px;
}

.sign svg path {
  fill: rgb(207, 0, 0);
}
.text {
  position: absolute;
  right: 0%;
  width: 0%;
  opacity: 0;
  color: white;
  font-size: 0.9em;
  font-weight: 600;
  transition-duration: 0.3s;
  
}

.Btn:hover {
  width: 120px;
  border-radius: 40px;
  transition-duration: 0.3s;
}

.Btn:hover .sign {
  width: 30%;
  transition-duration: 0.3s;
  padding-left: 2px;
}

.Btn:hover .text {
  opacity: 1;
  width: 70%;
  transition-duration: 0.3s;
  padding-right: 7px;
}
.Btn:active {
  transform: translate(2px, 2px);
}

</style>
<body>
<button class="Btn">
  <div class="sign">
    <svg class="download-icon" width="20" height="20" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <line x1="32" y1="12" x2="32" y2="44" stroke="white" stroke-width="6" stroke-linecap="round"/>
  <polyline points="16,36 32,52 48,36" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="16" y1="60" x2="48" y2="60" stroke="white" stroke-width="6" stroke-linecap="round"/>
</svg>
  </div>

  <div class="text">Download</div>
</button>



</body>
</html>
