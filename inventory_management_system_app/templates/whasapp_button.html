<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Modal Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* WhatsApp Floating Button (From Uiverse.io by Gaurang7717) */
    .w_Btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: 0.3s;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
      background-color: #00d757;
    }

    .whatsappSvg {
      margin-bottom: 2px;
      margin-left: 1px;
    }

    .w_sign {
      width: 100%;
      transition-duration: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .w_sign svg {
      width: 25px;
    }

    .w_sign svg path {
      fill: white;
    }

    .text {
      position: absolute;
      right: 0%;
      width: 0%;
      opacity: 0;
      color: white;
      font-size: 0.9em;
      font-weight: 600;
      transition-duration: 0.3s;
    }

    .w_Btn:hover {
      width: 120px;
      border-radius: 40px;
      transition-duration: 0.3s;
    }

    .w_Btn:hover .w_sign {
      width: 30%;
      transition-duration: 0.3s;
      padding-left: 2px;
    }

    .w_Btn:hover .text {
      opacity: 1;
      width: 70%;
      transition-duration: 0.3s;
      padding-right: 7px;
    }

    .w_Btn:active {
      transform: translate(2px, 2px);
    }

    /* Animation */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fadeInUp {
      animation: fadeInUp 0.3s ease-out;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <!-- WhatsApp Button -->

    <div class="w_sign">

  <!-- Backdrop -->
  <div id="formBackdrop" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-40 transition-opacity duration-300"></div>

  <!-- Modal -->
  <div id="formModalCard" class="hidden  fixed inset-0 flex items-center justify-center z-50 px-4">
    <div class="relative w-full max-w-sm sm:max-w-md rounded-xl bg-white p-6 shadow-lg backdrop-blur-md animate-fadeInUp">
      <!-- Close Button -->
      <button id="closeFormBtn" class="absolute right-3 top-3 text-gray-600 hover:text-gray-900 text-2xl font-bold">&times;</button>

      <label class="mb-6 block text-center text-2xl font-medium text-gray-700">Upload File</label>

      <!-- File Input + Submit -->
      <form class="flex flex-col gap-8" id="">
        <div class="relative w-full">
          <input type="text" id="copy_link_box"
          class="block w-full cursor-pointer rounded-full border-2 border-transparent text-sm text-gray-600

                 file:transition-all file:duration-500 file:ease-in-out
                 hover:border-blue-500 hover:file:bg-white hover:file:text-blue-500 hover:shadow-md" value=""/>
        </div>
      </form>

      <!-- OR Separator -->
      <div class="flex items-center justify-center font-semibold text-gray-500 mt-6">
        <span class="mr-2 flex-grow border-t border-gray-300 transition-all duration-500 ease-in-out"></span>
        <span>or</span>
        <span class="ml-2 flex-grow border-t border-gray-300 transition-all duration-500 ease-in-out"></span>
      </div>
      
      
      <div class="flex justify-center gap-3 mt-6">
      
          <button type="submit"  id="share-report-btn"
          class="rounded-full bg-green-500 px-5 py-2 text-white border-2 border-transparent
          transition-all duration-500 ease-in-out
          hover:border-green-500 hover:bg-white hover:text-green-500 hover:shadow-md">
          Download & Share
        </button>
      
      </div>
    </div>
  </div>

</script>



</body>
</html>
