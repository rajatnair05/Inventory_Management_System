<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Modal Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* WhatsApp Floating Button (From Uiverse.io by Gaurang7717) */
    .w_Btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: 0.3s;
      box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
      background-color: #f47216;
    }

    .whatsappSvg {
      margin-bottom: 2px;
      margin-left: 1px;
    }

    .w_sign {
      width: 100%;
      transition-duration: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .w_sign svg {
      width: 25px;
    }

    .w_sign svg path {
      fill: white;
    }

    .text {
      position: absolute;
      right: 0%;
      width: 0%;
      opacity: 0;
      color: white;
      font-size: 0.9em;
      font-weight: 600;
      transition-duration: 0.3s;
    }

    .w_Btn:hover {
      width: 120px;
      border-radius: 40px;
      transition-duration: 0.3s;
    }

    .w_Btn:hover .w_sign {
      width: 30%;
      transition-duration: 0.3s;
      padding-left: 2px;
    }

    .w_Btn:hover .text {
      opacity: 1;
      width: 70%;
      transition-duration: 0.3s;
      padding-right: 7px;
    }

    .w_Btn:active {
      transform: translate(2px, 2px);
    }

    /* Animation */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fadeInUp {
      animation: fadeInUp 0.3s ease-out;
    }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

  <!-- WhatsApp Button -->

    <div class="w_sign">

        <span>or</span>
        <span class="ml-2 flex-grow border-t border-gray-300 transition-all duration-500 ease-in-out"></span>
      </div>
      
      
      <div class="flex justify-center gap-3 mt-6">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const formModalCard = document.getElementById('formModalCard');
    const formBackdrop = document.getElementById('formBackdrop');
    const openFormBtn = document.getElementById('openFormBtn');
    const closeFormBtn = document.getElementById('closeFormBtn');
    const btn = document.getElementById('copyBtn');

    // Global functions
    window.openFormModal = function(link="link hai bhai") {
        formBackdrop.classList.remove('hidden');
        formModalCard.classList.remove('hidden');
        linkcopy = document.getElementById("copy_link_box");
        linkcopy.value = link;  
        

    }
    document.getElementById("copyBtn").addEventListener("click", () => {
    const icon = document.getElementById("copyIcon");

    // change icon color to green
    btn.classList.remove("border-[#0077db]");
    icon.setAttribute("stroke", "#22c55e");
    btn.classList.add("border-green-500");

    // revert to blue after 2 seconds
    setTimeout(() => {
      btn.classList.remove("border-green-500");
      icon.setAttribute("stroke", "#0077db");
      btn.classList.add("border-[#0077db]");
    }, 1000);
  });


    window.closeFormModal = function() {
        formBackdrop.classList.add('hidden');
        formModalCard.classList.add('hidden');
    }

    // Open & Close logic for main button
    openFormBtn.addEventListener('click', function(){ window.openDownloadModal("share")});
    closeFormBtn.addEventListener('click', window.closeFormModal);
    formBackdrop.addEventListener('click', window.closeFormModal);
});
   document.getElementById('shareBtn').addEventListener('click', () => {
          if (navigator.share) {
            navigator.share({
              title: 'Stock Report',
              url: document.getElementById("copy_link_box").value
            })
            
            .catch(err => alert('Sharing failed: ' + err));
            window.closeFormModal();
          } else {
            alert('Share not supported on this browser.');
    }
  });
</script>
