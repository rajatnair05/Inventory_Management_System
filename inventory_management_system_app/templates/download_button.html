{% block content %}
<!-- Include Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
/* ------------------ New Download Button ------------------ */
.Btn {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition-duration: 0.3s;
  box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.199);
  background-color: #0077db;
}

.download-icon {
  margin-bottom: 3px;
  margin-left: 1px;
}

.sign {
  width: 100%;
  transition-duration: 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sign svg {
  width: 25px;
}

.text {
  position: absolute;
  right: 0%;
  width: 0%;
  opacity: 0;
  color: white;
  font-size: 0.9em;
  font-weight: 600;
  transition-duration: 0.3s;
}

.Btn:hover {
  width: 120px;
  border-radius: 40px;
}

.Btn:hover .sign {
  width: 30%;
  padding-left: 2px;
}

.Btn:hover .text {
  opacity: 1;
  width: 70%;
  padding-right: 7px;
}

.Btn:active {
  transform: translate(2px, 2px);
}

/* ------------------ Form/Modal Styles ------------------ */
.tabs {
    display: flex;
    position: relative;
    background-color: #fff;
    box-shadow: 0 0 1px 0 rgba(24, 94, 224, 0.15),
                0 6px 12px 0 rgba(24, 94, 224, 0.15);
    border-radius: 12px;
    width: 280px;
    height: 40px;
    padding: 0 4px;
}

.tabs input[type="radio"] {
    display: none;
}

.tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #000;
    font-weight: 500;
    cursor: pointer;
    transition: color 0.2s ease-in;
    z-index: 2;
}

.tab:hover {
    color: #185ee0;
}

.tabs input[type="radio"]:checked + label {
    color: #185ee0;
    font-weight: 600;
}

.glider {
    position: absolute;
    top: 4px;
    left: 4px;
    height: 32px;
    width: calc(100% / 3 - 8px);
    background-color: #e6eef9;
    border-radius: 8px;
    z-index: 1;
    transition: transform 0.25s ease;
}

input[id="radio-1"]:checked ~ .glider { transform: translateX(0%); }
input[id="radio-2"]:checked ~ .glider { transform: translateX(108%); }
input[id="radio-3"]:checked ~ .glider { transform: translateX(220%); }

input[id="radio-4"]:checked ~ .glider { transform: translateX(0%); }
input[id="radio-5"]:checked ~ .glider { transform: translateX(108%); }
input[id="radio-6"]:checked ~ .glider { transform: translateX(220%); }

.material-input {
    position: relative;
    width: 100%;
}

.material-input input[type="date"] {
    width: 100%;
    border: none;
    border-bottom: 2px solid #ccc;
    padding: 0.75rem 0.5rem 0.25rem;
    background: transparent;
    font-size: 1rem;
    color: #333;
    transition: border-color 0.3s ease;
}

.material-input input[type="date"]:focus {
    outline: none;
    border-bottom-color: #0077db;
}

.material-input label {
    position: absolute;
    left: 0.5rem;
    top: 0.8rem;
    color: #666;
    font-size: 1rem;
    pointer-events: none;
    transition: 0.2s ease all;
}

.material-input input:focus + label,
.material-input input:not(:placeholder-shown) + label {
    top: -0.5rem;
    left: 0;
    font-size: 0.8rem;
    color: #0077db;
}

@media (max-width: 640px) {
    .tabs { width: 100%; max-width: 260px; height: 38px; }
    .glider { height: 30px; }
    .tab { font-size: 0.9rem; }
    .material-input input[type="date"] { font-size: 0.9rem; }
}

@media (max-width: 400px) {
    .tabs { max-width: 230px; height: 36px; padding: 0 2px; }
    .glider { height: 28px; }
    .tab { font-size: 0.85rem; }
    .material-input input[type="date"] { font-size: 0.85rem; }
}
</style>

<!-- ------------------ Download Button ------------------ -->
<div class="h-min flex items-center justify-center w-min">
    {% block button %}
    <button class="Btn" type="button" id="downloadBtn">
        <div class="sign">
            <svg class="download-icon" width="20" height="20" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                <line x1="32" y1="12" x2="32" y2="44" stroke="white" stroke-width="6" stroke-linecap="round"/>
                <polyline points="16,36 32,52 48,36" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="16" y1="60" x2="48" y2="60" stroke="white" stroke-width="6" stroke-linecap="round"/>
            </svg>
        </div>
        <div class="text">Download</div>
    </button>
    {% endblock button %}
</div>

<!-- ------------------ Backdrop / Modal ------------------ -->
<div id="backdrop" class="fixed inset-0 backdrop-blur-sm bg-black/50 hidden z-40 flex items-center justify-center">
    <div id="modal" class="bg-white rounded-xl p-6 sm:p-8 text-gray-800 shadow-xl border border-gray-300 max-w-md w-full mx-4 relative">
        <button id="close" class="absolute top-2 right-2 text-gray-500 hover:text-gray-900 text-2xl font-bold z-10">&times;</button>
        <p class="text-center text-xl sm:text-2xl font-bold text-[#0077db] mb-4">Download Report</p>

        <form id="downloadForm" class="space-y-6" method="post" >
            {% csrf_token %}
            <input type="hidden" name="emp_id" value="{{ emp_id }}">

            <div class="material-input ">
                <input type="date"  id="from_date" name="from_date" placeholder=" " required>
                <label for="from_date">From Date</label>
            </div>

            <div class="material-input ">
                <input type="date" id="to_date" name="to_date" placeholder=" " required>
                <label for="to_date">To Date</label>
            </div>

            <!-- Tabs -->
            <div class="flex flex-col gap-6 items-center justify-center mt-4">
                <div class="tabs">
                    <input type="radio" name="tabs1" id="radio-1" checked value="issue">
                    <label for="radio-1" class="tab">Issue</label>
                    <input type="radio" name="tabs1" id="radio-2" value="return">
                    <label for="radio-2" class="tab">Return</label>
                    <input type="radio" name="tabs1" id="radio-3" value="all">
                    <label for="radio-3" class="tab">All</label>
                    <span class="glider"></span>
                </div>

                <div class="tabs">
                    <input type="radio" name="tabs2" id="radio-4" checked value="xlsx">
                    <label for="radio-4" class="tab">XLSX</label>
                    <input type="radio" name="tabs2" id="radio-5" value="pdf">
                    <label for="radio-5" class="tab">PDF</label>
                    <input type="radio" name="tabs2" id="radio-6" value="csv">
                    <label for="radio-6" class="tab">CSV</label>
                    <span class="glider"></span>
                </div>
            </div>
         <input type="hidden" name="action" id="modalAction" value="download">
<button id="actionBtn" class="bg-[#0077db] rounded-2xl w-full text-white px-4 py-2 rounded flex items-center justify-center">
  <span class="btn-text">Submit</span>
</button>

        </form>
    </div>
</div>

<!-- ------------------ JavaScript ------------------ -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const downloadBtn = document.getElementById('downloadBtn');
    const backdrop = document.getElementById('backdrop');
    const modal = document.getElementById('modal');
    const closeBtn = document.getElementById('close');
    const form = document.getElementById('downloadForm');
    const hiddenInput = document.getElementById('modalAction');
    const actionBtn = document.getElementById('actionBtn');
    const btnText = actionBtn.querySelector('.btn-text');

    // ------------------ Loader Functions ------------------
    function open_loader(button, text="Loading...") {
        button.disabled = true;
        const span = button.querySelector('.btn-text');
         button.innerHTML = `
        <span class="flex items-center justify-center gap-2 w-full">
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span>${text}</span>
        </span>
    `;
    }

    function close_loader(button, text="Submit") {
        button.disabled = false;
         button.innerHTML = `<span class="btn-text">${text}</span>`;
    }

    // ------------------ Modal Functions ------------------
    window.openDownloadModal = function(actionType = "download") {
        backdrop.classList.remove('hidden');
        modal.classList.remove('hidden');
        hiddenInput.value = actionType; // set hidden input
    }

    function closeModal() {
        backdrop.classList.add('hidden');
        modal.classList.add('hidden');
    }

    if(downloadBtn){
        downloadBtn.addEventListener('click', function(){
            window.openDownloadModal("download");
        });
    }

    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
    modal.addEventListener('click', e => e.stopPropagation());

    // ------------------ Form Submit ------------------
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        console.log("Form submitted with action:", hiddenInput.value);

        open_loader(actionBtn, hiddenInput.value === "share" ? "Sharing..." : "Downloading...");

        if (hiddenInput.value === "download") {
            // Set form action and submit normally
            form.action = "{% url 'download_report' %}";
            form.submit(); 
            setTimeout(() => {
                close_loader(actionBtn); // re-enable button after a delay
            }, 5000);
            // Loader will remain active until browser handles download
        } 
        else if (hiddenInput.value === "share") {
            fetch("{% url 'download_report' %}", {
                method: "POST",
                body: new FormData(form),
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                }
            })
            .then(response => {
                if (!response.ok) throw new Error("Network response was not ok");
                return response.json();
            })
            .then(data => { 
                close_loader(actionBtn); // restore button after response
                closeModal(); // close download modal
                window.openFormModal(data.share_url); // open share modal with link
            })
            .catch(error => {
                console.error("Error:", error);
                close_loader(actionBtn); // restore button even on error
                alert("Failed to share. Try again!");
            });
        }
    });
});
</script>


{% endblock %}
